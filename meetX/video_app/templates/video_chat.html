
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call App with Chat & Screen Share</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 40px;
        }

        #videoContainer video {
            width: 320px;
            height: 240px;
            margin: 10px;
            border-radius: 15px;
            border: 2px solid #34495e;
        }

        #controls button {
            margin: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #controls button:hover {
            background-color: #2980b9;
        }

        #chatContainer {
            margin-top: 20px;
            max-width: 500px;
            margin: auto;
        }

        #messages {
            max-height: 250px;
            overflow-y: auto;
            background-color: #34495e;
            padding: 12px;
            border-radius: 8px;
        }

        #messages div {
            margin: 5px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .sent {
            background-color: #2ecc71;
            text-align: right;
        }

        .received {
            background-color: #e74c3c;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>ConnectX</h1>

    <div>
        <button id="createRoom">Create Room</button>
        <input id="roomInput" type="text" placeholder="Enter Room ID" />
        <button id="joinRoom">Join Room</button>
    </div>

    <div id="videoContainer">
        <video id="localVideo" autoplay muted></video>
        <video id="remoteVideo" autoplay></video>
    </div>

    <div id="controls">
        <button id="toggleCamera">Turn On Camera</button>
        <button id="toggleMic">Turn On Mic</button>
        <button id="startScreenShare">Share Screen</button>
    </div>

    <div id="chatContainer">
        <div id="messages"></div>
        <input id="chatInput" type="text" placeholder="Type a message..." />
        <button id="sendMessage">Send</button>
    </div>

    <script>
        const peer = new Peer();
        let localStream = null;
        let remoteStream = null;
        let currentCall = null;
        let dataConnection = null;
        let screenStream = null;

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const createRoomButton = document.getElementById('createRoom');
        const joinRoomButton = document.getElementById('joinRoom');
        const roomInput = document.getElementById('roomInput');
        const toggleCameraButton = document.getElementById('toggleCamera');
        const toggleMicButton = document.getElementById('toggleMic');
        const startScreenShareButton = document.getElementById('startScreenShare');
        const chatInput = document.getElementById('chatInput');
        const sendMessageButton = document.getElementById('sendMessage');
        const messagesDiv = document.getElementById('messages');

        let isCameraOn = true;
        let isMicOn = true;

        navigator.mediaDevices
            .getUserMedia({ video: true, audio: true })
            .then((stream) => {
                localStream = stream;
                localVideo.srcObject = localStream;
            })
            .catch((err) => console.error('Failed to get local stream', err));

        createRoomButton.addEventListener('click', () => {
            const roomId = peer.id;
            alert(`Room created! Share this Room ID: ${roomId}`);
        });

        joinRoomButton.addEventListener('click', () => {
            const roomId = roomInput.value.trim();
            if (!roomId) {
                alert('Please enter a Room ID');
                return;
            }

            dataConnection = peer.connect(roomId);  
            setupChat();

            const call = peer.call(roomId, localStream);
            handleCall(call);
        });

        peer.on('connection', (conn) => {
            dataConnection = conn;
            setupChat();
        });

        peer.on('call', (call) => {
            call.answer(localStream);
            handleCall(call);
        });

        sendMessageButton.addEventListener('click', () => {
            const message = chatInput.value.trim();
            if (message && dataConnection) {
                dataConnection.send(message);
                appendMessage(message, 'sent');
                chatInput.value = '';
            }
        });

        function setupChat() {
            if (!dataConnection) return;

            dataConnection.on('data', (message) => {
                appendMessage(message, 'received');
            });

            dataConnection.on('open', () => console.log('Chat connection established'));
            dataConnection.on('close', () => console.log('Chat connection closed'));
        }

        function appendMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.textContent = message;
            messageDiv.className = type;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleCall(call) {
            currentCall = call;

            call.on('stream', (stream) => {
                remoteStream = stream;
                remoteVideo.srcObject = remoteStream;
            });

            call.on('close', () => {
                remoteVideo.srcObject = null;
                console.log('Call ended');
            });
        }

        startScreenShareButton.addEventListener('click', async () => {
            if (!screenStream) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    const screenTrack = screenStream.getVideoTracks()[0];

                    if (currentCall && currentCall.peerConnection) {
                        const sender = currentCall.peerConnection
                            .getSenders()
                            .find((s) => s.track.kind === 'video');
                        if (sender) sender.replaceTrack(screenTrack);
                    }

                    screenTrack.onended = () => {
                        if (localStream) {
                            const cameraTrack = localStream.getVideoTracks()[0];
                            if (currentCall && currentCall.peerConnection) {
                                const sender = currentCall.peerConnection
                                    .getSenders()
                                    .find((s) => s.track.kind === 'video');
                                if (sender) sender.replaceTrack(cameraTrack);
                            }
                        }
                        screenStream = null;
                    };
                } catch (err) {
                    console.error('Error starting screen sharing:', err);
                }
            }
        });

        toggleCameraButton.addEventListener('click', () => {
            isCameraOn = !isCameraOn;
            localStream.getVideoTracks()[0].enabled = isCameraOn;
            toggleCameraButton.textContent = isCameraOn ? 'Turn Off Camera' : 'Turn On Camera';
        });

        toggleMicButton.addEventListener('click', () => {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            toggleMicButton.textContent = isMicOn ? 'Turn Off Mic' : 'Turn On Mic';
        });

        peer.on('open', () => console.log(`Peer connected with ID: ${peer.id}`));
    </script>
</body>
</html>

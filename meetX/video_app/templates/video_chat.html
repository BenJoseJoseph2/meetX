<!DOCTYPE html>
<html>
<head>
    <title>Room-based Screen Sharing with PeerJS</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg,rgb(87, 91, 105),rgb(87, 86, 86),rgb(80, 117, 165));
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 0 10px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            color: #f7e7d4;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.6);
        }

        #connectionDetails {
            margin-bottom: 40px;
            text-align: center;
        }

        input, button {
            padding: 12px 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            margin: 10px;
        }

        button {
            background: linear-gradient(90deg,rgb(95, 196, 255),rgb(83, 229, 255));
            color: #fff;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: linear-gradient(90deg, #feb47b, #ff7e5f);
            transform: scale(1.05);
        }

        #videoContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
        }

        video {
            width: 300px;
            height: 200px;
            border: 3px solid #f7e7d4;
            border-radius: 12px;
            background: #000;
            object-fit: contain;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        #screenPreview {
            width: 400px;
            height: 300px;
            border: 3px dashed #f7e7d4;
            border-radius: 12px;
            background: #000;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        #controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        #mediaControls {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .control-group {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>MEETX</h1>
 
    <div id="connectionDetails">
        <button id="createRoomButton">Create Room</button>
        <input type="text" id="roomInput" placeholder="Enter Room ID to join" />
        <button id="joinRoomButton">Join Room</button>
    </div>

    <div id="videoContainer">
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <video id="screenPreview" autoplay playsinline muted></video>

    <div id="controls">
        <button id="startScreenShare">Start Screen Sharing</button>
        <button id="endCall" style="display:none;">End Call</button>
        <div id="mediaControls">
            <button id="toggleCamera">Turn Off Camera</button>
            <button id="toggleMic">Turn Off Mic</button>
        </div>
    </div>

    <script>
        const peer = new Peer();
        let localStream = null;
        let currentCall = null;
        let screenStream = null;
        let roomId = null;
        let isCameraOn = true;
        let isMicOn = true;

        const createRoomButton = document.getElementById('createRoomButton');
        const joinRoomButton = document.getElementById('joinRoomButton');
        const roomInput = document.getElementById('roomInput');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const startScreenShareButton = document.getElementById('startScreenShare');
        const screenPreview = document.getElementById('screenPreview');
        const endCallButton = document.getElementById('endCall');
        const toggleCameraButton = document.getElementById('toggleCamera');
        const toggleMicButton = document.getElementById('toggleMic');

        // Initialize local video
        navigator.mediaDevices
            .getUserMedia({ video: true, audio: true })
            .then((stream) => {
                localStream = stream;
                localVideo.srcObject = localStream;
            })
            .catch((error) => console.error('Error accessing media devices:', error));

        // Create a new room
        createRoomButton.addEventListener('click', () => {
            roomId = peer.id;
            const roomLink = `${window.location.origin}?room=${roomId}`;
            alert(`Room created! Share this link: ${roomLink}`);
        });

        // Join a room
        joinRoomButton.addEventListener('click', () => {
            const enteredRoomId = roomInput.value.trim();
            if (!enteredRoomId) {
                alert('Please enter a valid Room ID');
                return;
            }
            roomId = enteredRoomId;
            const call = peer.call(roomId, localStream);
            handleCall(call);
        });

        // Handle incoming calls
        peer.on('call', (call) => {
            call.answer(localStream);
            handleCall(call);
        });

        // Handle calls (incoming or outgoing)
        function handleCall(call) {
            currentCall = call;
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
            });
            call.on('close', () => {
                remoteVideo.srcObject = null;
                endCallButton.style.display = 'none';
            });
            endCallButton.style.display = 'block';
        }

        // Handle screen sharing
        startScreenShareButton.addEventListener('click', () => {
            navigator.mediaDevices
                .getDisplayMedia({ video: true })
                .then((stream) => {
                    screenStream = stream;
                    screenPreview.srcObject = screenStream;

                    const screenTrack = screenStream.getVideoTracks()[0];
                    const sender = currentCall?.peerConnection
                        .getSenders()
                        .find((s) => s.track.kind === 'video');

                    if (sender) sender.replaceTrack(screenTrack);

                    screenTrack.onended = () => {
                        const webcamTrack = localStream.getVideoTracks()[0];
                        if (sender) sender.replaceTrack(webcamTrack);
                    };
                })
                .catch((error) => console.error('Error sharing screen:', error));
        });

        // Toggle camera
        toggleCameraButton.addEventListener('click', () => {
            isCameraOn = !isCameraOn;
            localStream.getVideoTracks()[0].enabled = isCameraOn;
            toggleCameraButton.textContent = isCameraOn ? 'Turn Off Camera' : 'Turn On Camera';
        });

        // Toggle microphone
        toggleMicButton.addEventListener('click', () => {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            toggleMicButton.textContent = isMicOn ? 'Turn Off Mic' : 'Turn On Mic';
        });

        // End call
        endCallButton.addEventListener('click', () => {
            if (currentCall) currentCall.close();
        });

        // Automatically join room from URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('room');
        if (roomFromUrl) {
            roomId = roomFromUrl;
            const call = peer.call(roomId, localStream);
            handleCall(call);
        }

        peer.on('open', () => {
            console.log('PeerJS initialized with ID:', peer.id);
        });
    </script>
</body>
</html>
